<ion-header>

  <ion-toolbar color="primary">

    <ion-title>

      Bodega Carlitos

    </ion-title>

  </ion-toolbar>

</ion-header>

<ion-content class="home-content">

  <div class="header-home">

    <h2>Bienvenido 👋</h2>

    <p>
      Sistema de Recepción y Control de Inventario
    </p>

  </div>

  <ion-grid>

    <ion-row>

      <ion-col size="6">

        <ion-card routerLink="/tabs/nueva-recepcion">

          <ion-card-content>

            <ion-icon
              name="basket-outline"
              class="card-icon">

            </ion-icon>

            <h3>Recepción</h3>

          </ion-card-content>

        </ion-card>

      </ion-col>

      <ion-col size="6">

        <ion-card routerLink="/tabs/historial">

          <ion-card-content>

            <ion-icon
              name="time-outline"
              class="card-icon">

            </ion-icon>

            <h3>Historial</h3>

          </ion-card-content>

        </ion-card>

      </ion-col>

    </ion-row>

    <ion-row>

      <ion-col size="6">

        <ion-card routerLink="/tabs/inventario">

          <ion-card-content>

            <ion-icon
              name="cube-outline"
              class="card-icon">

            </ion-icon>

            <h3>Inventario</h3>

          </ion-card-content>

        </ion-card>

      </ion-col>

      <ion-col size="6">

        <ion-card routerLink="/tabs/reclamos">

          <ion-card-content>

            <ion-icon
              name="alert-circle-outline"
              class="card-icon">

            </ion-icon>

            <h3>Reclamos</h3>

          </ion-card-content>

        </ion-card>

      </ion-col>

    </ion-row>

    <ion-row>

      <ion-col size="6">

        <ion-card routerLink="/tabs/proveedores">

          <ion-card-content>

            <ion-icon
              name="people-outline"
              class="card-icon">

            </ion-icon>

            <h3>Proveedores</h3>

          </ion-card-content>

        </ion-card>

      </ion-col>

    </ion-row>

  </ion-grid>

  <ion-button
    expand="block"
    color="danger"
    class="logout"
    (click)="cerrarSesion()">

    <ion-icon
      slot="start"
      name="log-out-outline">

    </ion-icon>

    Cerrar Sesión

  </ion-button>

</ion-content>
