<ion-content class="login-content">

  <div class="login-container">

    <ion-icon
      name="storefront-outline"
      class="logo">

    </ion-icon>

    <h1>Bodega Carlitos</h1>

    <ion-item>

      <ion-label position="floating">
        Usuario
      </ion-label>

      <ion-input
        type="text"
        [(ngModel)]="usuario">

      </ion-input>

    </ion-item>

    <ion-item>

      <ion-label position="floating">
        Contraseña
      </ion-label>

      <ion-input
        type="password"
        [(ngModel)]="password">

      </ion-input>

    </ion-item>

    <ion-button
      expand="block"
      (click)="ingresar()">

      <ion-icon
        name="log-in-outline"
        slot="start">

      </ion-icon>

      Ingresar

    </ion-button>

  </div>

</ion-content>
