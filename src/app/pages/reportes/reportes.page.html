<ion-header>
  <ion-toolbar>
    <ion-title>
      Reportes
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="reportes-content">

  <div class="titulo">
    <h2>Generación de Reportes</h2>
    <p>Filtra la información antes de exportarla en PDF.</p>
  </div>

  <ion-card>

    <ion-card-header>

      <ion-card-title>
        <ion-icon name="options-outline"></ion-icon>
        Filtros
      </ion-card-title>

    </ion-card-header>

    <ion-card-content>

      <ion-item>

        <ion-icon
          slot="start"
          name="business-outline">
        </ion-icon>

        <ion-label position="stacked">
          Proveedor
        </ion-label>

        <ion-select
          [(ngModel)]="proveedorSeleccionado">

          <ion-select-option value="">
            Todos
          </ion-select-option>

          <ion-select-option
            *ngFor="let p of proveedores"
            [value]="p.nombre">

            {{p.nombre}}

          </ion-select-option>

        </ion-select>

      </ion-item>

      <ion-item>

        <ion-icon
          slot="start"
          name="calendar-outline">
        </ion-icon>

        <ion-label position="stacked">
          Fecha Inicial
        </ion-label>

        <ion-input
          type="date"
          [(ngModel)]="fechaInicio">
        </ion-input>

      </ion-item>

      <ion-item>

        <ion-icon
          slot="start"
          name="calendar-clear-outline">
        </ion-icon>

        <ion-label position="stacked">
          Fecha Final
        </ion-label>

        <ion-input
          type="date"
          [(ngModel)]="fechaFin">
        </ion-input>

      </ion-item>

    </ion-card-content>

  </ion-card>

  <div class="botones">

    <ion-button
      expand="block"
      color="success"
      (click)="generarPDF()">

      <ion-icon
        slot="start"
        name="document-text-outline">
      </ion-icon>

      Reporte General

    </ion-button>

    <ion-button
      expand="block"
      color="primary"
      (click)="generarInventario()">

      <ion-icon
        slot="start"
        name="cube-outline">
      </ion-icon>

      Inventario Actual

    </ion-button>

    <ion-button
      expand="block"
      color="danger"
      (click)="generarRechazados()">

      <ion-icon
        slot="start"
        name="warning-outline">
      </ion-icon>

      Productos Rechazados

    </ion-button>

  </div>

</ion-content>
