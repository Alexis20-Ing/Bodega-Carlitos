<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Nueva Recepción</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- TIPO DE PROVEEDOR -->

  <ion-item>
    <ion-label>Tipo de proveedor</ion-label>

    <ion-select [(ngModel)]="esNuevoProveedor">

      <ion-select-option [value]="false">
        Existente
      </ion-select-option>

      <ion-select-option [value]="true">
        Nuevo proveedor
      </ion-select-option>

    </ion-select>
  </ion-item>

  <!-- EXISTENTE -->

  <ion-item *ngIf="!esNuevoProveedor">

    <ion-label>Proveedor</ion-label>

    <ion-select [(ngModel)]="proveedor">

      <ion-select-option
        *ngFor="let p of proveedores"
        [value]="p.nombre">

        {{ p.nombre }}

      </ion-select-option>

    </ion-select>

  </ion-item>

  <!-- NUEVO PROVEEDOR -->

  <div *ngIf="esNuevoProveedor">

    <ion-item>
      <ion-label position="floating">
        Nombre proveedor
      </ion-label>

      <ion-input [(ngModel)]="nuevoProveedor"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">
        Teléfono
      </ion-label>

      <ion-input [(ngModel)]="nuevoTelefono"></ion-input>
    </ion-item>

  </div>

  <!-- PRODUCTO -->

  <ion-item>
    <ion-label position="floating">Producto</ion-label>

    <ion-input [(ngModel)]="producto"></ion-input>
  </ion-item>

  <!-- CANTIDAD -->

  <ion-item>
    <ion-label position="floating">Cantidad</ion-label>

    <ion-input type="number" [(ngModel)]="cantidad"></ion-input>
  </ion-item>

  <!-- PRECIO -->

  <ion-item>
    <ion-label position="floating">Precio</ion-label>

    <ion-input type="number" [(ngModel)]="precio"></ion-input>
  </ion-item>

  <!-- ❌ ELIMINADO: ESTADO (IMPORTANTE) -->
  <!-- Ya NO se usa porque el flujo es automático:
       pendiente → verificación → aceptado/rechazado -->

  <!-- BOTÓN FOTO -->

  <ion-button
    expand="block"
    color="secondary"
    (click)="tomarFoto()">

    Tomar Foto

  </ion-button>

  <!-- FOTO -->

  <img
    *ngIf="foto"
    [src]="foto"
    style="
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      margin-top: 15px;
      border-radius: 12px;
    ">

  <!-- GUARDAR -->

  <ion-button
    expand="block"
    color="primary"
    (click)="guardarProducto()">

    Guardar

  </ion-button>

</ion-content>
