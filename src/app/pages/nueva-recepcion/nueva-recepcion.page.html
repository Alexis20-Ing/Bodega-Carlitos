<ion-header>

  <ion-toolbar>

    <ion-title>

      Nueva Recepción

    </ion-title>

  </ion-toolbar>

</ion-header>

<ion-content class="recepcion-content">

  <div class="titulo">

    <h2>Nueva Recepción</h2>

    <p>
      Registra el ingreso de nuevos productos.
    </p>

  </div>

  <ion-card>

    <ion-card-content>

      <!-- TIPO PROVEEDOR -->

      <ion-item>

        <ion-label position="stacked">

          Tipo de proveedor

        </ion-label>

        <ion-select [(ngModel)]="esNuevoProveedor">

          <ion-select-option [value]="false">

            Existente

          </ion-select-option>

          <ion-select-option [value]="true">

            Nuevo proveedor

          </ion-select-option>

        </ion-select>

      </ion-item>

      <!-- EXISTENTE -->

      <ion-item *ngIf="!esNuevoProveedor">

        <ion-label position="stacked">

          Proveedor

        </ion-label>

        <ion-select [(ngModel)]="proveedor">

          <ion-select-option

            *ngFor="let p of proveedores"

            [value]="p.nombre">

            {{p.nombre}}

          </ion-select-option>

        </ion-select>

      </ion-item>

      <!-- NUEVO -->

      <div *ngIf="esNuevoProveedor">

        <ion-item>

          <ion-label position="stacked">

            Nombre del proveedor

          </ion-label>

          <ion-input

            [(ngModel)]="nuevoProveedor">

          </ion-input>

        </ion-item>

        <ion-item>

          <ion-label position="stacked">

            Teléfono

          </ion-label>

          <ion-input

            [(ngModel)]="nuevoTelefono">

          </ion-input>

        </ion-item>

      </div>

      <ion-item>

        <ion-label position="stacked">

          Producto

        </ion-label>

        <ion-input

          [(ngModel)]="producto">

        </ion-input>

      </ion-item>

      <ion-item>

        <ion-label position="stacked">

          Cantidad

        </ion-label>

        <ion-input

          type="number"

          [(ngModel)]="cantidad">

        </ion-input>

      </ion-item>

      <ion-item>

        <ion-label position="stacked">

          Precio

        </ion-label>

        <ion-input

          type="number"

          [(ngModel)]="precio">

        </ion-input>

      </ion-item>

      <ion-button

        expand="block"

        fill="outline"

        color="primary"

        (click)="tomarFoto()">

        <ion-icon

          slot="start"

          name="camera-outline">

        </ion-icon>

        Tomar Foto

      </ion-button>

      <img

        *ngIf="foto"

        [src]="foto"

        class="foto">

      <ion-button

        expand="block"

        color="success"

        (click)="guardarProducto()">

        <ion-icon

          slot="start"

          name="save-outline">

        </ion-icon>

        Registrar Recepción

      </ion-button>

    </ion-card-content>

  </ion-card>

</ion-content>
